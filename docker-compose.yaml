version: '4.97'

services:
  mongo:
    image: mongo:6
    restart: always
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    expose:
      - "5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/bank_app
      - SECRET_KEY=supersecretkey
    depends_on:
      - mongo

  transactions:
    build: ./transactions
    expose:
      - "3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - PORT=3000
    restart: on-failure
    depends_on:
      - mongo

  frontend:
    build: ./studentportfolio
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - transactions

volumes:
  mongo_data: